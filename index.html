<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Student Crud FireBase</title>
</head>

<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Student Management System</h2> <!-- Student Form -->
        <div class="card p-4 mb-5">
            <h4 class="mb-3">Student Form</h4>
            <form id="studentForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="name" class="form-label">Student Name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter student name">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" id="age" class="form-control" placeholder="Enter age">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="course" class="form-label">Course</label>
                        <select id="course" class="form-select form-control">
                            <option value="">Select Course</option>
                            <option value="BSc IT">BSc IT</option>
                            <option value="BCA">BCA</option>
                            <option value="BSc CS">BSc CS</option>
                            <option value="BCom">BCom</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="year" class="form-label">Year</label>
                        <select id="year" class="form-select form-control">
                            <option value="">Select Year</option>
                            <option value="First Year">First Year</option>
                            <option value="Second Year">Second Year</option>
                            <option value="Third Year">Third Year</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="rollNo" class="form-label">Roll No</label>
                        <input type="number" id="rollNo" class="form-control" placeholder="Enter roll number">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" id="city" class="form-control" placeholder="Enter city">
                    </div>

                    <div class="col-md-6">
                        <button type="submit" class="btn btn-primary" id="addBtn"> Add Student </button>
                        <button type="button" class="btn btn-primary d-none" id="updateBtn"> Update </button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn"> Cancel </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="container"> <!-- Student Table -->
        <h4 class="mb-3">Student List</h4>
        <div class="table-responsive">
            <table class="table table-bordered table-striped text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Sr. No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Roll No</th>
                        <th>City</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"> <!-- Student data will come here -->

                </tbody>
            </table>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./assets/js/app.js"></script>
</body>

</html>
